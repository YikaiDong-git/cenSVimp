[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "censvimp"
dynamic = ["version"]
description = "Imputation of centromeric structural variants from pericentromeric SNPs with per-SV elastic nets"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Yikai Dong"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.7",
    "cyvcf2>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
censvimp = "censvimp.cli:main"

[tool.setuptools.dynamic]
version = {attr = "censvimp.__version__"}

[tool.setuptools.packages.find]
include = ["censvimp*"]

[tool.setuptools.package-data]
censvimp = ["resources/*.bed"]
